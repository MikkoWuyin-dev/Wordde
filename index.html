<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy (CONSTRAINTS.md §7). Shipped policy — strict, production-grade:
        • default-src 'self'      — everything defaults to same-origin (offline-first: no external origins exist)
        • script-src 'self'       — no inline/eval scripts; Vite emits external module bundles
        • style-src 'unsafe-inline' — React style attributes and dynamic background-image styles are load-bearing
        • img-src blob:           — user-uploaded logo/backgrounds load from IndexedDB object URLs
        • img-src data:           — margin for icon/fallback data URIs in bundled UI primitives
        • connect-src ws:/wss:    — Vite HMR in dev; future LAN-WebSocket remote transport (Teardown §7)
      Development note: `vite` dev injects an inline React-refresh preamble, so the dev
      server swaps this policy for a relaxed one via vite.config.ts (csp-dev-relaxer).
      `vite preview` serves this file as built and therefore tests the real policy.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' ws: wss:; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/App Icon Orange.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/App%20Icon%20Orange.png" />
    <link rel="preload" href="/fonts/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Poppins-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/PlayfairDisplay-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <!-- No-flash theme boot: resolves the persisted theme before first paint.
         External file because the CSP ships script-src 'self' (no inline). -->
    <script src="/theme-boot.js"></script>
    <!-- Wordde — offline-first Bible search and projection -->
    <title>Wordde</title>
    <meta name="description" content="An offline first, simplicity focused presentation software that allows operators to look up Bible verses and project at high speeds.">
    <!-- Chrome color follows the SYSTEM (the automatic default theme); a hard
         user override still renders correctly, only this chrome tint stays system-true. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wordde" />
    <meta property="og:description" content="An offline first, simplicity focused presentation software that allows operators to look up Bible verses and project at high speeds." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Wordde" />
    <meta name="twitter:description" content="An offline first, simplicity focused presentation software that allows operators to look up Bible verses and project at high speeds." />
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
